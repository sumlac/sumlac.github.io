name: Security Factory

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

# No write token, public-target probing, model credentials, or deployment step.
permissions:
  contents: read

concurrency:
  group: security-factory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offense:
    name: Offense / isolated local reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out authorized source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Install local browser runtime
        run: npx playwright install --with-deps chromium
      - name: Exercise local engine and browser attack corpus
        shell: bash
        run: |
          mkdir -p artifacts/factory
          python3 -m http.server 8000 --bind 127.0.0.1 > artifacts/factory/local-server.log 2>&1 &
          factory_server_pid=$!
          trap 'kill "$factory_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 0.2
          done
          factory_seed="${GITHUB_SHA}:$(date -u +%F)"
          node scripts/factory-offense.cjs --browser --url http://127.0.0.1:8000 --seed "$factory_seed" --output artifacts/factory/offense.json
      - name: Preserve offense evidence even when checks fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offense-factory
          path: artifacts/factory/
          if-no-files-found: warn
          retention-days: 30

  defense:
    name: Defense / regression and reviewed proposals
    needs: offense
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the same source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Install browser for isolated proposal verification
        run: npx playwright install --with-deps chromium
      - name: Retrieve offense reproductions
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offense-factory
          path: artifacts/factory/
      - name: Audit source, run regressions, and verify eligible patches in temporary copies
        run: node scripts/factory-defense.cjs --offense-report artifacts/factory/offense.json --output artifacts/factory/defense.json --browser
      - name: Preserve defense evidence and review-only proposals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: defense-factory
          path: artifacts/factory/
          if-no-files-found: warn
          retention-days: 30
